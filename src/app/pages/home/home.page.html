<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="ion-padding-start">Orbit Hub</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding home-content">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">Orbit Hub</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Container Geral com espaçamento Apple (max-width e respiros) -->
  <div class="orbit-home-container orbit-content-container">
    
    <!-- Cabeçalho de Boas-vindas -->
    <div class="welcome-section">
      <span class="badge-subtitle">PAINEL DE ESTUDOS</span>
      <h1 class="welcome-title">Seus Tópicos Ativos</h1>
      <p class="welcome-desc">Selecione um módulo abaixo para continuar sua jornada de aprendizado.</p>
    </div>

    <!-- Grid Gadgets -->

    <!-- Mantenha o conteúdo atual do card -->
        <div class="orbit-grid">
            @for (topic of activeTopics$ | async; track topic.id) {

                <div 
                    role="link"
                    tabindex="0"
                    (click)="openTopicDetail(topic.id)"
                    (keydown.enter)="openTopicDetail(topic.id)"
                    class="orbit-gadget-card" 
                >
            
                    <div>

                        <!-- Ícone / Logo do Tópico com Glow interno -->
                        <div class="gadget-icon-wrapper">
                        <ion-icon [name]="getCategoryIcon(topic.category)" class="gadget-icon"></ion-icon>
                        </div>

                        <!-- Informações do Tópico -->
                        <div class="gadget-info">
                        <span class="gadget-category">{{ topic.category }}</span>
                        <h3 class="gadget-title">{{ topic.title }}</h3>
                        </div>

                        <!-- Progresso em Barra Minimalista -->
                        <div class="gadget-footer">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" [style.width.%]="topic.progress"></div>
                        </div>
                        <span class="progress-text">{{ topic.progress }}%</span>
                        </div>

                    </div>
                </div>

            }
        </div>
    </div>
</ion-content>
